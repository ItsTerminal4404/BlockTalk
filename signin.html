<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <title>Sign in - BlockTalk</title>
    <link rel="stylesheet" href="auth-page.css">
</head>
<body data-auth-mode="signin">
    <main class="auth-box">
        <header class="auth-header">
            <img class="brand-logo" src="logo.png" alt="BlockTalk logo">
            <h1>Sign in to BlockTalk</h1>
            <p class="subtitle">Use your username and access key.</p>
        </header>
        <form id="authForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" minlength="3" maxlength="32" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="accessKey">Access key</label>
                <input id="accessKey" type="password" minlength="32" maxlength="32" autocomplete="current-password" required>
            </div>
            <p class="error" id="error" role="alert"></p>
            <button class="auth-button" id="submitButton" type="submit">Sign in</button>
        </form>
        <p class="auth-toggle">New to BlockTalk? <a href="signup.html">Create an account</a></p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/gun.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gun@0.2020.1240/sea.js"></script>
    <script src="auth-page.js"></script>
</body>
</html>
