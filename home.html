<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="logo.png">
    <title>Welcome to BlockTalk</title>
    <link rel="stylesheet" href="auth-page.css">
</head>
<body>
    <main class="welcome-page">
        <section class="auth-box welcome-box">
            <img class="welcome-logo" src="logo.png" alt="BlockTalk logo">
            <h1 class="welcome-title">Welcome to BlockTalk</h1>
            <p class="welcome-description">
                Private, encrypted messaging and calls in your browser. Sign in with your access key,
                or create an account to receive one.
            </p>
            <div class="welcome-actions">
                <a class="auth-button welcome-button" href="signin.html">Sign In</a>
                <a class="auth-button welcome-button secondary" href="signup.html">Sign Up</a>
            </div>
            <p class="welcome-help">Your access key is generated during sign-up and is required for future sign-ins.</p>
        </section>
    </main>
</body>
</html>
